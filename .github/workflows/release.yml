name: Release packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked vVERSION tag to npm (requires NPM_TOKEN and npm-release environment authorization)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:prepare
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm release:check .repro/npm-release
      - uses: actions/upload-artifact@v4
        with:
          name: repro-npm-release
          path: .repro/npm-release
      - name: Require matching immutable version tag
        if: inputs.publish
        run: node scripts/publish-release.mjs --check-tag
      - name: Publish checked archives
        if: inputs.publish
        run: node scripts/publish-release.mjs .repro/npm-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
