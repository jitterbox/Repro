name: AI Eval

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  agent-e2e-and-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Agent E2E mock (no API keys)
        continue-on-error: true
        run: pnpm --filter @repro/agent-e2e test

      - name: Agent E2E live (optional)
        continue-on-error: true
        env:
          REPRO_AGENT_E2E: ${{ secrets.REPRO_AGENT_E2E }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ "${REPRO_AGENT_E2E:-}" = "1" ] && [ -n "${ANTHROPIC_API_KEY:-}${CURSOR_API_KEY:-}" ]; then
            pnpm --filter @repro/agent-e2e test
          else
            echo "Skipping live agent E2E (set REPRO_AGENT_E2E=1 and an API key secret)."
          fi

      - name: Judge eval (optional)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            pnpm --filter @repro/evaluation test
          else
            echo "Skipping judge eval (ANTHROPIC_API_KEY not configured)."
          fi
